version: '3.8'

services:
  event-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: event-reg-platform:1.0.0
    container_name: college-event-platform
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - event-net

  nginx-proxy:
    image: nginx:alpine
    container_name: college-event-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - event-app
    networks:
      - event-net

networks:
  event-net:
    driver: bridge
