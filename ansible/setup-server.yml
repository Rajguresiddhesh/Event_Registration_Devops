---
# ==============================================================================
# Ansible Server Provisioning Playbook
# Milestone 13: Server Prerequisites & Environment Hardening
# Student: 23102A0003 - SIDDHESH RAJGURE
# ==============================================================================
- name: Configure and Harden Target Server for College Event Registration Platform
  hosts: app_servers
  become: yes
  vars:
    required_packages:
      - openjdk-17-jre-headless
      - curl
      - git
      - docker.io
      - ufw
      - tar
    app_directories:
      - "{{ deploy_dir }}"
      - "{{ deploy_dir }}/bin"
      - "{{ deploy_dir }}/config"
      - "{{ deploy_dir }}/logs"
      - "{{ backup_dir }}"

  tasks:
    - name: 1. Update APT package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: 2. Install required system packages
      package:
        name: "{{ item }}"
        state: present
      loop: "{{ required_packages }}"

    - name: 3. Create dedicated system group for event platform
      group:
        name: "{{ app_group }}"
        state: present
        system: yes

    - name: 4. Create unprivileged service user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        shell: /bin/bash
        home: "{{ deploy_dir }}"
        system: yes
        create_home: no
        state: present

    - name: 5. Add appuser to docker group
      user:
        name: "{{ app_user }}"
        groups: docker
        append: yes

    - name: 6. Create required directory hierarchy with secure permissions
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop: "{{ app_directories }}"

    - name: 7. Configure firewall rule for application port
      ufw:
        rule: allow
        port: "{{ app_port }}"
        proto: tcp
      when: ansible_os_family == "Debian"

    - name: 8. Configure firewall rule for HTTP reverse proxy port
      ufw:
        rule: allow
        port: '80'
        proto: tcp
      when: ansible_os_family == "Debian"

    - name: 9. Ensure Docker service is enabled and started
      service:
        name: docker
        state: started
        enabled: yes

    - name: 10. Audit system prerequisites
      command: java -version
      register: java_check
      changed_when: false

    - name: 11. Display provisioning verification
      debug:
        msg: "Target server successfully provisioned for SIDDHESH RAJGURE (23102A0003). Java and Docker are active."
