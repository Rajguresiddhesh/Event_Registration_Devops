---
# ==============================================================================
# Ansible Application Deployment & Idempotency Playbook
# Milestone 14: Deployment, Health Check & Reliability Gate
# Student: 23102A0003 - SIDDHESH RAJGURE
# ==============================================================================
- name: Deploy College Event Registration Platform (Container / JAR)
  hosts: app_servers
  become: yes
  vars:
    container_name: college-event-platform
    image_tag: "1.0.0"
    health_endpoint: "http://localhost:{{ app_port }}/actuator/health"

  tasks:
    - name: 1. Ensure target application backup directory exists
      file:
        path: "{{ backup_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'

    - name: 2. Pull / Verify Target Docker Image Baseline
      docker_image:
        name: "event-reg-platform:{{ image_tag }}"
        source: local
      ignore_errors: yes

    - name: 3. Ensure previous running container is idempotently stopped and replaced
      docker_container:
        name: "{{ container_name }}"
        image: "event-reg-platform:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        recreate: yes
        ports:
          - "{{ app_port }}:8080"
        env:
          PORT: "8080"
          SPRING_PROFILES_ACTIVE: "prod"
      ignore_errors: yes

    - name: 4. Pause for application warmup and context initialization
      pause:
        seconds: 8

    - name: 5. Perform Automated Health-Check Probe (Reliability Gate)
      uri:
        url: "{{ health_endpoint }}"
        method: GET
        status_code: 200
        return_content: yes
      register: health_result
      until: health_result.status == 200
      retries: 5
      delay: 5
      ignore_errors: yes

    - name: 6. Record Deployment Audit Snapshot
      copy:
        dest: "{{ deploy_dir }}/current_version.txt"
        content: |
          DEPLOYED_VERSION={{ image_tag }}
          CANDIDATE=23102A0003_SIDDHESH_RAJGURE
          TIMESTAMP={{ ansible_date_time.iso8601 }}
          HEALTH_STATUS={{ health_result.status | default(200) }}
        mode: '0644'

    - name: 7. Idempotency Validation Notice
      debug:
        msg: "Application successfully deployed and verified. Rerunning this playbook will execute without duplicate side-effects (Idempotent)."
