spring.application.name=college-event-registration-platform
server.port=${PORT:8080}

# Database Configuration (H2 In-Memory with persistence capability)
spring.datasource.url=jdbc:h2:mem:eventregdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Actuator Health Endpoints for CI/CD & Docker & Ansible Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Thymeleaf Template Settings
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Application Meta
app.platform.title=College Event Registration Platform
app.platform.student.roll=23102A0003
app.platform.student.name=SIDDHESH RAJGURE
app.platform.version=1.0.0
